<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業種別 給与レンジを1業種ずつ見る</title>
<meta name="description" content="業種ごとの給与レンジの構成を、回して眺められる積み木のような立体で1業種ずつ見る。">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css?v=7240179b">
<link rel="stylesheet" href="object.css?v=7240179b">
<meta name="build" content="7240179b">
<!-- build:importmap（scripts/stamp-version.mjs が生成） -->
<script type="importmap">

 "imports": {
  "three": "../vendor/three/three.module.min.js?v=7240179b",

  "../js/closeup.js": "../js/closeup.js?v=7240179b",
  "../js/colors.js": "../js/colors.js?v=7240179b",

  "../js/discs.js": "../js/discs.js?v=7240179b",
  "../js/format.js": "../js/format.js?v=7240179b",

  "../js/main.js": "../js/main.js?v=7240179b",

</head>
<body>
<main>
  <header>
    <h1>給与レンジを、積み木のように眺める</h1>
    <p class="lede">円盤1枚が給与レンジ1つです。下が低い給与、上が高い給与で、円盤の面積は、その業種の中でそのレンジにいる人の割合に比例します。ドラッグで回し、ホイールやピンチで近づけます。</p>
  </header>
  <div class="controls">
    <div class="ctl"><label for="industry">業種</label>
      <button id="prev" type="button" aria-label="前の業種">‹</button>
      <select id="industry"></select>
      <button id="next" type="button" aria-label="次の業種">›</button></div>
    <div class="ctl yearctl"><b id="yearlabel"></b>
      <div class="yearpick"><input type="range" id="year" min="0" max="10" step="1" value="10" aria-label="年分"><div class="yticks" id="yticks"></div></div></div>
    <div class="ctl"><span>対象</span>
      <div class="seg" id="sex" role="group" aria-label="対象">
        <button type="button" data-s="0">男女計</button><button type="button" data-s="1">男性</button><button type="button" data-s="2">女性</button>
      </div></div>
    <div class="ctl"><label for="scheme">配色</label>
      <select id="scheme"><option value="PuOr">オレンジ〜紫</option><option value="RdBu">赤〜青</option><option value="RdYlBu">赤〜黄〜青</option><option value="BrBG">茶〜青緑</option><option value="PiYG">ピンク〜緑</option><option value="PRGn">紫〜緑</option></select></div>
  </div>
  <div class="stage">
    <div class="view" id="view"><canvas id="canvas" aria-label="給与レンジの円盤を積み重ねた立体"></canvas>
      <button id="reset" type="button">視点を戻す</button></div>
    <aside class="panel">
      <h2 id="name"></h2>
      <p id="meta"></p>
      <dl id="stats"></dl>
      <table id="bands"><thead><tr><th>給与レンジ</th><th>割合</th><th>人数</th></tr></thead><tbody></tbody></table>
    </aside>
  </div>
  <footer>
    <div class="fnote"><span>円盤にカーソルを合わせる（タップする）と、右の表の対応する行が強調されます。元の統計表に数値がない層は円盤がなく、表に「該当なし」と出ます。</span>
    <span>データソース：国税庁「民間給与実態統計調査」全国計表 第9表（1年を通じて勤務した給与所得者、2014〜2024年分）。<a href="../">全業種の一覧に戻る</a></span></div>
    <div class="credit">制作：<a href="https://notation.co.jp/">矢崎裕一</a></div>
  </footer>
</main>
<script src="../vendor/d3.v7.9.0.min.js"></script>
<script type="module" src="object.js?v=7240179b"></script>
</body>
</html>
