<body>
<main>
  <header>
    <h1>業種によって給与レンジはどのくらい異なるのか？</h1>
    <p class="lede">積み木1つが業種1つ、円盤1枚が給与レンジ1つです。下が低い給与、上が高い給与です。<span id="sizetext"></span>ドラッグで回し、ホイールやピンチで近づけます。積み木をクリック（タップ）すると、その業種だけが残り、左右に内訳が出ます。</p>
  </header>
  <div class="controls">
    <div class="ctl"><span>円盤の面積</span>
      <div class="seg" id="size" role="group" aria-label="円盤の面積">
        <button type="button" data-v="share">業種内の割合</button><button type="button" data-v="count">人数</button>
      </div></div>
    <div class="ctl yearctl"><b id="yearlabel"></b>
      <div class="yearpick"><input type="range" id="year" min="0" max="10" step="1" value="10" aria-label="年分"><div class="yticks" id="yticks"></div></div></div>
    <div class="ctl"><span>対象</span>
      <div class="seg" id="sex" role="group" aria-label="対象">
        <button type="button" data-s="0">男女計</button><button type="button" data-s="1">男性</button><button type="button" data-s="2">女性</button>
      </div></div>
  </div>
  <div class="view wideview" id="view"><canvas id="canvas" aria-label="14業種の給与レンジの円盤を積み重ねた立体"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="focusui"><svg id="leads" aria-hidden="true"></svg><div id="fhead"></div><div id="frows"></div>
      <div class="fsex" id="fmale">男性</div><div class="fsex" id="ffemale">女性</div></div>
    <div class="viewbtns"><button id="pair" type="button" aria-pressed="false" hidden>男女を並べる</button><button id="reset" type="button" hidden>全体に戻る</button></div></div>
  <div id="bandlegend" class="bandlegend" aria-label="給与レンジの色"></div>
  <footer>
    <div class="fnote"><span>「人数」にすると、全業種で同じ尺度になります。大きい積み木ほど、その業種で働く人が多いことを表します。元の統計表に数値がない層は円盤がありません。</span>
    <span>データソース：国税庁「民間給与実態統計調査」全国計表 第9表（1年を通じて勤務した給与所得者、2014〜2024年分）。<a href="object/">1業種ずつ見る</a></span></div>

  </footer>
